<header class="cabecera-pagina animate__animated animate__fadeIn animate__faster">
  <h1 class="titulo-pagina">Personas y casas</h1>
  <p class="descripcion-pagina">
    Casas dentro del conjunto
  </p>
</header>

<nav class="control-segmentado" aria-label="Pestañas de Personas y casas">
  @for (p of pestanas; track p.ruta) {
    <a
      class="boton-segmento"
      [routerLink]="p.ruta"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
    >
      <i class="fa-solid" [class]="p.icono" aria-hidden="true"></i>
      {{ p.texto }}
    </a>
  }
</nav>

<router-outlet />
