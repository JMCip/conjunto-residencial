<header class="cabecera-pagina animate__animated animate__fadeIn animate__faster">
  <h1 class="titulo-pagina">Facturas de administración</h1>
  <p class="descripcion-pagina">
    Cobros mensuales de administración de cada casa del conjunto.
  </p>
</header>

@if (error()) {
  <!-- Error -->
  <section class="tarjeta-seccion mensaje-error animate__animated animate__fadeIn animate__faster">
    <span class="circulo-icono circulo-error" aria-hidden="true">
      <i class="fa-solid fa-plug-circle-xmark"></i>
    </span>
    <h2 class="titulo-vacio">No se pudo consultar la información</h2>
    <p class="texto-vacio">Verifica que el backend esté corriendo.</p>
  </section>
} @else {
  <app-totales-finanzas [facturas]="facturas()" [cargando]="cargando()" />

  <!-- Tarjeta con filtros y tabla -->
  <section
    class="tarjeta-seccion animate__animated animate__fadeInUp animate__faster"
    aria-labelledby="titulo-tabla"
  >
    <div class="cabecera-tarjeta">
      <h2 id="titulo-tabla" class="titulo-tarjeta">Facturas</h2>
      <app-filtros-facturas
        [filtroEstado]="filtroEstado()"
        [busqueda]="busqueda()"
        [conteos]="conteos()"
        [cargando]="cargando()"
        (cambiarFiltro)="cambiarFiltro($event)"
        (buscar)="buscar($event)"
      />
    </div>

    <app-tabla-facturas
      [facturas]="facturasFiltradas()"
      [cargando]="cargando()"
      [textoConteo]="textoConteo()"
      (limpiarFiltros)="limpiarFiltros()"
    />
  </section>
}
