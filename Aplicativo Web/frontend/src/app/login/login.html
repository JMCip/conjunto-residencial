<main class="pantalla-login">
  <section class="tarjeta-login animate__animated animate__fadeInUp animate__faster">
    <div class="marca-login">
      <span class="logo-login" aria-hidden="true">
        <i class="fa-solid fa-house"></i>
      </span>
      <div>
        <p class="nombre-marca">Conjunto Residencial</p>
        <p class="subtitulo-marca">Administración</p>
      </div>
    </div>

    <h1 class="titulo-login">Iniciar sesión</h1>
    <p class="descripcion-login">Ingresa con la cuenta de administrador del conjunto.</p>

    <form class="formulario-login" (ngSubmit)="iniciarSesion()" novalidate>
      <div class="campo">
        <label for="usuario" class="etiqueta-campo">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          class="input-login"
          autocomplete="username"
          [(ngModel)]="usuario"
          [disabled]="cargando()"
        />
      </div>

      <div class="campo">
        <label for="clave" class="etiqueta-campo">Contraseña</label>
        <div class="envoltura-clave">
          <input
            id="clave"
            name="clave"
            class="input-login"
            autocomplete="current-password"
            [type]="verClave() ? 'text' : 'password'"
            [(ngModel)]="clave"
            [disabled]="cargando()"
          />
          <button
            type="button"
            class="boton-ver-clave"
            [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="verClave.set(!verClave())"
          >
            <i class="fa-solid" [class.fa-eye]="!verClave()" [class.fa-eye-slash]="verClave()" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      @if (mensajeError()) {
        <p class="mensaje-error" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          {{ mensajeError() }}
        </p>
      }

      <button type="submit" class="boton-primario" [disabled]="cargando()">
        @if (cargando()) {
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Ingresando…
        } @else {
          Ingresar
        }
      </button>
    </form>
  </section>
</main>
